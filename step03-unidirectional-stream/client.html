<!doctype html>
<html lang="ja">
<meta charset="utf-8" />
<title>Step03 - Unidirectional Stream</title>
<style>
  body { font-family: system-ui, sans-serif; padding: 2rem; max-width: 720px; }
  pre { background: #111; color: #0f0; padding: 1rem; border-radius: 8px; min-height: 12rem; max-height: 24rem; overflow: auto; }
  input { width: 100%; font-family: monospace; }
</style>

<h1>Step03 — Unidirectional Stream</h1>
<p>サーバから毎秒流れてくる tick をストリームで受信します。</p>

<label>SHA-256 cert hash (base64):
  <input id="hash" />
</label>
<p><button id="go">Connect</button></p>
<pre id="log"></pre>

<script type="module">
  // === shared/protocol/framing.js を inline (学習向けに自己完結させるため) ===
  const HEADER = 4;
  function createFrameDecoder() {
    let buf = new Uint8Array(0);
    return {
      push(chunk) {
        const next = new Uint8Array(buf.byteLength + chunk.byteLength);
        next.set(buf); next.set(chunk, buf.byteLength); buf = next;
        const out = [];
        while (buf.byteLength >= HEADER) {
          const len = new DataView(buf.buffer, buf.byteOffset, buf.byteLength).getUint32(0, false);
          if (buf.byteLength < HEADER + len) break;
          out.push(buf.slice(HEADER, HEADER + len));
          buf = buf.slice(HEADER + len);
        }
        return out;
      },
    };
  }
  const decodeText = (u8) => new TextDecoder().decode(u8);

  // === UI ===
  const $log = document.getElementById('log');
  const log = (m) => { $log.textContent += m + '\n'; $log.scrollTop = $log.scrollHeight; };
  const $hash = document.getElementById('hash');
  $hash.value = localStorage.getItem('certHash') ?? '';

  document.getElementById('go').onclick = async () => {
    try {
      const b64 = $hash.value.trim();
      let bin;
      try {
        bin = Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
      } catch (e) {
        log('❌ invalid base64: ' + e.message);
        return;
      }
      localStorage.setItem('certHash', b64);

      const wt = new WebTransport('https://localhost:4433/step03', {
        serverCertificateHashes: [{ algorithm: 'sha-256', value: bin.buffer }],
      });

      wt.closed.then(
        () => log('ℹ️ connection closed'),
        (e) => log('❌ connection closed with error: ' + e.message),
      );

      await wt.ready;
      log('✅ connected');

      let incoming;
      try {
        incoming = wt.incomingUnidirectionalStreams.getReader();
      } catch (e) {
        log('❌ failed to get stream reader: ' + e.message);
        return;
      }

      while (true) {
        let result;
        try {
          result = await incoming.read();
        } catch (e) {
          log('❌ incoming streams read error: ' + e.message);
          break;
        }
        if (result.done) break;
        readStream(result.value).catch((e) => log('❌ stream read error: ' + e.message));
      }
    } catch (e) {
      log('❌ ' + e.message);
    }
  };

  async function readStream(readable) {
    const reader = readable.getReader();
    const decoder = createFrameDecoder();
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      for (const frame of decoder.push(value)) {
        log('← ' + decodeText(frame));
      }
    }
  }
</script>
</html>
