<!doctype html>
<html lang="ja">
<meta charset="utf-8" />
<title>Step02 - Hello WebTransport</title>
<style>
  body { font-family: system-ui, sans-serif; padding: 2rem; max-width: 720px; }
  pre { background: #111; color: #0f0; padding: 1rem; border-radius: 8px; min-height: 8rem; }
  input { width: 100%; font-family: monospace; }
  button { padding: .5rem 1rem; }
</style>

<h1>Step02 — Hello WebTransport</h1>

<p>1. <code>bash shared/cert/generate-cert.sh</code> を実行し、<code>certs/cert.sha256.b64</code> の中身をコピー</p>
<p>2. 下に貼り付けて [Connect] を押す</p>

<label>SHA-256 cert hash (base64):
  <input id="hash" placeholder="例: abcd...=" />
</label>
<p><button id="go">Connect</button></p>

<pre id="log"></pre>

<script type="module">
  const $log = document.getElementById('log');
  const $hash = document.getElementById('hash');
  const $go = document.getElementById('go');
  const log = (m) => { $log.textContent += m + '\n'; };

  // 開発者の手間を減らすため localStorage で保持
  $hash.value = localStorage.getItem('certHash') ?? '';

  $go.onclick = async () => {
    const b64 = $hash.value.trim();
    if (!b64) { log('❌ cert hash が空です'); return; }
    localStorage.setItem('certHash', b64);

    // base64 → Uint8Array
    const bin = Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));

    const url = 'https://localhost:4433/step02';
    log(`→ new WebTransport(${url})`);

    const wt = new WebTransport(url, {
      serverCertificateHashes: [{ algorithm: 'sha-256', value: bin.buffer }],
    });

    try {
      await wt.ready;
      log('✅ session ready (QUIC + TLS1.3 handshake OK)');
      log('   (サーバ側ログにも "hello" が出ているはず)');
    } catch (e) {
      log('❌ 接続失敗: ' + e.message);
      return;
    }

    wt.closed.then(
      (info) => log('👋 closed: ' + JSON.stringify(info)),
      (err) => log('⚠️  closed with error: ' + err.message),
    );
  };
</script>
</html>
